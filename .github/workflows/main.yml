name: Main

on:
  pull_request:
  push:
    branches: [main]
  # Deploys are gated on the triggering push's diff, so a push whose worker
  # changes failed CI, fixed by a push that doesn't touch the worker, never
  # ships the worker. This redeploys main's worker without a fake change.
  workflow_dispatch:
    inputs:
      deploy_worker:
        description: Redeploy the worker and gateway from main
        type: boolean
        default: false

permissions:
  contents: read
  pull-requests: read

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.changes.outputs.code }}
      shared: ${{ steps.changes.outputs.shared }}
      app: ${{ steps.changes.outputs.app }}
      worker: ${{ steps.changes.outputs.worker }}
      db_security: ${{ steps.changes.outputs.db_security }}

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - uses: dorny/paths-filter@9d7afb8d214ad99e78fbd4247752c4caed2b6e4c # v4.0.0
        id: changes
        with:
          filters: |
            code:
              - 'src/**'
              - 'public/**'
              - 'scripts/**'
              - 'shared/**'
              - 'supabase/**'
              - 'extensions/**'
              - '.github/workflows/**'
              - 'package.json'
              - 'bun.lock'
              - 'tsconfig.json'
              - 'biome.json'
              - 'components.json'
              - 'Dockerfile.worker'
              - '.dockerignore'
              - 'Dockerfile.app'
              - 'Dockerfile.app.dockerignore'
              - 'ladle-vite.config.ts'
              - 'lefthook.yml'
              - 'vite.config.ts'
            shared:
              - 'src/lib/**'
              - 'shared/**'
              - 'package.json'
              - 'bun.lock'
              - 'tsconfig.json'
              - 'biome.json'
            app:
              - '.github/workflows/**'
              - 'src/routes/**'
              - 'src/features/**'
              - 'src/components/**'
              - 'src/integrations/**'
              - 'src/types/**'
              - 'src/env.ts'
              - 'src/env.public.ts'
              - 'src/routeTree.gen.ts'
              - 'src/server.ts'
              - 'src/serve.ts'
              - 'src/instrument.ts'
              - 'src/start.ts'
              - 'src/router.tsx'
              - 'src/client.tsx'
              - 'src/styles.css'
              - 'public/**'
              - 'vite.config.ts'
              - 'Dockerfile.app'
              - 'Dockerfile.app.dockerignore'
            worker:
              - 'src/worker/**'
              - 'src/env.ts'
              - 'Dockerfile.worker'
              - '.dockerignore'
            db_security:
              - 'supabase/**'
              - 'src/lib/data/**'
              - '.github/workflows/**'

  verify:
    needs: detect
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: verify-${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true

    steps:
      - name: Skip docs-only changes
        if: needs.detect.outputs.code != 'true'
        run: echo "No code changes detected; skipping verify."

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        if: needs.detect.outputs.code == 'true'
        with:
          # A PR checks out its merge commit; depth 2 brings its first parent,
          # the base tip, for the migration preview below.
          fetch-depth: 2

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        if: needs.detect.outputs.code == 'true'
        with:
          no-cache: true

      # Preview of what migrate-prod will refuse after merge, so a destructive
      # migration is visible in review rather than as a blocked deploy.
      - name: Warn on destructive migrations in this PR
        if: needs.detect.outputs.code == 'true' && github.event_name == 'pull_request'
        run: |
          set -o pipefail
          git diff -z --name-only --diff-filter=AM HEAD^1 HEAD -- 'supabase/migrations/*.sql' \
            | xargs -0 --no-run-if-empty bun scripts/db/scan-destructive-migrations.ts --warn

      - name: Restore Bun install cache
        if: needs.detect.outputs.code == 'true'
        id: bun-cache-restore
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-install-cache-${{ hashFiles('package.json', 'bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-install-cache-

      - if: needs.detect.outputs.code == 'true'
        run: bun install --frozen-lockfile
      - if: needs.detect.outputs.code == 'true'
        run: bun run check
      - if: needs.detect.outputs.code == 'true'
        run: bun run typecheck
      - if: needs.detect.outputs.code == 'true'
        run: bun run typecheck:worker

      - if: needs.detect.outputs.code == 'true'
        run: bun run test:fast

      - name: Build webapp
        if: needs.detect.outputs.code == 'true' && (needs.detect.outputs.app == 'true' || needs.detect.outputs.shared == 'true')
        run: bun run build

      # Building isn't enough: an image missing a source dir (shared/ in Oct 2026)
      # builds fine and crash-loops in prod on the first import. Started with no
      # env, a complete image links its whole import graph and only then fails
      # env validation; a broken one fails earlier with a resolve error.
      - name: Smoke-build and start worker image
        if: needs.detect.outputs.code == 'true' && (needs.detect.outputs.worker == 'true' || needs.detect.outputs.shared == 'true')
        run: |
          docker build -f Dockerfile.worker -t worker-smoke .
          for entry in src/worker/index.ts src/worker/gateway-entry.ts; do
            out=$(docker run --rm --entrypoint bun worker-smoke --preload ./src/worker/instrument.ts "$entry" 2>&1 || true)
            if ! grep -q "Invalid environment variables" <<<"$out"; then
              echo "$out" | tail -20
              echo "::error::$entry did not load its full import graph in the worker image"
              exit 1
            fi
          done

      - name: Save Bun install cache
        if: needs.detect.outputs.code == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.bun-cache-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.bun/install/cache
          key: ${{ steps.bun-cache-restore.outputs.cache-primary-key }}

  db-security:
    needs: detect
    # Every *.integration.test.ts runs here, not in verify (no database there,
    # so they self-skip). Any code change can alter a query they pin, so this
    # follows the code filter as well as the schema/data paths.
    if: needs.detect.outputs.db_security == 'true' || needs.detect.outputs.code == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    timeout-minutes: 20
    env:
      # One value for the CLI pin and the image-cache key: the CLI version decides
      # which images `supabase start` pulls.
      SUPABASE_CLI_VERSION: 2.101.0
    concurrency:
      group: db-security-${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          no-cache: true

      - name: Restore Bun install cache
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-install-cache-${{ hashFiles('package.json', 'bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-install-cache-

      - run: bun install --frozen-lockfile

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf # v2.1.1
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}
          github-token: ${{ github.token }}

      # Anonymous ghcr.io/supabase/* pulls get throttled (toomanyrequests) and
      # failed this job twice on 2026-10-28; authenticated pulls get the
      # per-token limit instead.
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The login alone isn't enough: GHCR still throttled ghcr.io/supabase/postgres
      # on three runs in a row on 2026-10-28, and ECR Public's anonymous quota is
      # shared by every runner ("Data limit exceeded"). Once one run has pulled the
      # images they come from the Actions cache, which has no such limit. The CLI
      # version and config.toml decide which images `supabase start` needs.
      - name: Restore Supabase images
        id: supabase-images
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ runner.temp }}/supabase-images.tar
          key: ${{ runner.os }}-supabase-images-${{ env.SUPABASE_CLI_VERSION }}-${{ hashFiles('supabase/config.toml') }}

      - name: Load Supabase images
        if: steps.supabase-images.outputs.cache-hit == 'true'
        run: docker load -i "$RUNNER_TEMP/supabase-images.tar"

      - name: Start local Supabase and run DB integration tests
        id: db-tests
        run: |
          # Integration tests need only Postgres and the REST gateway; skipping the
          # rest cuts the parallel GHCR pulls that get throttled (2026-10-27).
          for attempt in 1 2 3; do
            supabase start -x studio,imgproxy,storage-api,postgres-meta,edge-runtime,logflare,vector,mailpit && break
            [ "$attempt" -eq 3 ] && exit 1
            supabase stop --no-backup || true
            sleep 60
          done
          # Only a full start caches images; a partial set would hit the key forever.
          echo "started=true" >> "$GITHUB_OUTPUT"
          # Redirect, not `. <(...)`: process substitution hides a status failure from set -e.
          supabase status -o env \
            --override-name db.url=DATABASE_URL \
            --override-name api.url=SUPABASE_URL \
            --override-name auth.service_role_key=SUPABASE_SERVICE_ROLE_KEY \
            --override-name auth.anon_key=SUPABASE_ANON_KEY > "$RUNNER_TEMP/supabase.env"
          set -a
          . "$RUNNER_TEMP/supabase.env"
          set +a
          # Gate must fail, not silently skip, on a missing/non-local URL.
          : "${DATABASE_URL:?DATABASE_URL not exported}"
          : "${SUPABASE_URL:?SUPABASE_URL not exported}"
          # config.toml disables GoTrue (Better Auth owns auth), so `status` prints
          # no API keys. The gateway still accepts the CLI's fixed local-only
          # defaults, which are public and useless against any real project.
          export SUPABASE_SERVICE_ROLE_KEY="${SUPABASE_SERVICE_ROLE_KEY:-sb_secret_N7UND0UgjKTVK-Uodkm0Hg_xSvEMPvz}"
          export SUPABASE_ANON_KEY="${SUPABASE_ANON_KEY:-sb_publishable_ACJWlzQHlZjBrEguHvfOxg_3BJgxAaH}"
          case "$DATABASE_URL" in
            *127.0.0.1*|*localhost*) ;;
            *) echo "::error::DATABASE_URL is not local; integration tests would skip"; exit 1 ;;
          esac

          bun run test:fast --project integration \
            --reporter=default --reporter=json --outputFile="$RUNNER_TEMP/integration.json"
          # Each suite self-skips when its env gate is unmet, so a silent skip here
          # means lost coverage, not a pass.
          skipped=$(jq '.numPendingTests + .numTodoTests' "$RUNNER_TEMP/integration.json")
          if [ "$skipped" -ne 0 ]; then
            echo "::error::$skipped integration tests skipped; check the exported env"
            exit 1
          fi

      - name: Export Supabase images
        id: export-images
        if: ${{ !cancelled() && steps.supabase-images.outputs.cache-hit != 'true' && steps.db-tests.outputs.started == 'true' }}
        run: |
          images=$(docker images --format '{{.Repository}}:{{.Tag}}' | grep '/supabase/' || true)
          [ -n "$images" ] || exit 0
          # shellcheck disable=SC2086 # one argument per image
          docker save $images -o "$RUNNER_TEMP/supabase-images.tar"
          echo "saved=true" >> "$GITHUB_OUTPUT"

      - name: Save Supabase images
        if: ${{ !cancelled() && steps.export-images.outputs.saved == 'true' }}
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ runner.temp }}/supabase-images.tar
          key: ${{ steps.supabase-images.outputs.cache-primary-key }}

  migrate-prod:
    needs: [detect, verify, db-security]
    # Reconciles from REMOTE STATE on every green push to main — deliberately not
    # gated on whether this push touched supabase/migrations/**. `supabase db
    # push` is idempotent: it applies only migrations missing from the remote
    # schema_migrations and is a no-op otherwise, so the extra runs are cheap.
    # Gating on the per-commit diff once stranded a migration in prod: the commit
    # that ADDED it failed `verify`, so this job skipped; the follow-up commit
    # that fixed `verify` changed only test files, so the migrations path-filter
    # was false and it skipped again — leaving main ahead of prod with nothing to
    # ever re-trigger the apply. Driving off remote state closes that gap.
    if: >-
      !cancelled()
      && needs.verify.result == 'success'
      && (needs.db-security.result == 'success' || needs.db-security.result == 'skipped')
      && github.event_name == 'push'
      && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    environment: production-db
    timeout-minutes: 15
    concurrency:
      group: migrate-production-db
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf # v2.1.1
        with:
          version: 2.101.0
          github-token: ${{ github.token }}

      # Runs only the dependency-free migration scanner; no `bun install`, so
      # no third-party package code runs next to the prod credential.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          no-cache: true

      - name: Connect to production tailnet
        uses: tailscale/github-action@780049a30b6ff5c378a9e7b389d15ece7a204888 # v4.1.3
        with:
          oauth-client-id: ${{ vars.TS_OAUTH_CLIENT_ID }}
          audience: ${{ vars.TS_AUDIENCE }}
          tags: tag:ci
          ping: 100.75.236.20

      - name: Validate prod migration config
        env:
          PROD_DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
        run: |
          test -n "$PROD_DATABASE_URL" || { echo "Missing production-db secret PROD_DATABASE_URL"; exit 1; }
          # Guard against the old hosted target: migrations must go to self-host.
          echo "$PROD_DATABASE_URL" | grep -q 'supabase.hearted.music' || {
            echo "PROD_DATABASE_URL does not point at the self-host pooler (supabase.hearted.music)"; exit 1;
          }

      # Destructive DDL ("Manual-Only Changes" in docs/ops/prod-db-migrations.md)
      # is refused here and applied supervised. The scan covers what this push
      # would apply — the dry run's remote-pending list, not this commit's
      # diff — so once the owner applies a flagged migration by hand, remote
      # history records it, the next run (or a re-run of this one) finds
      # nothing pending, and deploys resume. Until then every run fails
      # closed, as it does when the dry run errors or prints a transcript the
      # scanner can't parse.
      - name: Apply prod migrations
        env:
          PROD_DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
        run: |
          TAILSCALE_DATABASE_URL="${PROD_DATABASE_URL/supabase.hearted.music/100.75.236.20}"
          test "$TAILSCALE_DATABASE_URL" != "$PROD_DATABASE_URL" || {
            echo "PROD_DATABASE_URL host could not be replaced with the Tailscale address"; exit 1;
          }
          # The CLI prints the plan on stderr and the summary on stdout.
          plan="$RUNNER_TEMP/db-push-plan.txt"
          if ! supabase db push --dry-run --db-url "$TAILSCALE_DATABASE_URL" > "$plan" 2>&1; then
            cat "$plan"
            echo "::error::supabase db push --dry-run failed; not applying migrations"
            exit 1
          fi
          cat "$plan"
          bun scripts/db/scan-destructive-migrations.ts --dry-run-output "$plan"
          supabase db push --db-url "$TAILSCALE_DATABASE_URL" --yes

  deploy-app:
    needs: [detect, verify, db-security, migrate-prod]
    if: >-
      !cancelled()
      && needs.verify.result == 'success'
      && (needs.db-security.result == 'success' || needs.db-security.result == 'skipped')
      && (needs.migrate-prod.result == 'success' || needs.migrate-prod.result == 'skipped')
      && github.event_name == 'push'
      && needs.detect.outputs.code == 'true'
      && (needs.detect.outputs.app == 'true' || needs.detect.outputs.shared == 'true')
    runs-on: ubuntu-latest
    environment: production-app
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    concurrency:
      group: deploy-app-production
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Image name
        # GHCR rejects upper-case repository names.
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}-app" >> "$GITHUB_ENV"

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build and push app image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile.app
          push: true
          # Reuses unchanged layers across runs, so an unchanged bun.lock yields
          # the same node_modules layer digest and the VPS skips pulling it
          # (each fresh 1 GB layer helped fill its disk on 2026-10-28). mode=min
          # caches only the final image's layers, which keeps this off the 10 GB
          # repo cache budget the Supabase image tarball also lives in.
          cache-from: type=gha,scope=app-image
          cache-to: type=gha,mode=min,scope=app-image
          # Coolify deploys :latest; the SHA tag is what a rollback pins.
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          secrets: |
            sentry_auth_token=${{ secrets.SENTRY_AUTH_TOKEN }}
          build-args: |
            VITE_PUBLIC_APP_ORIGIN=${{ vars.VITE_PUBLIC_APP_ORIGIN }}
            VITE_ACCOUNT_EVENTS_GATEWAY_URL=${{ vars.VITE_ACCOUNT_EVENTS_GATEWAY_URL }}
            VITE_SENTRY_DSN=${{ vars.VITE_SENTRY_DSN }}
            VITE_SENTRY_ENVIRONMENT=${{ vars.VITE_SENTRY_ENVIRONMENT }}
            VITE_SENTRY_ORG_SLUG=${{ vars.VITE_SENTRY_ORG_SLUG }}
            VITE_CHROME_EXTENSION_ID=${{ vars.VITE_CHROME_EXTENSION_ID }}
            VITE_APP_TITLE=${{ vars.VITE_APP_TITLE }}
            VITE_PUBLIC_POSTHOG_PROJECT_TOKEN=${{ vars.VITE_PUBLIC_POSTHOG_PROJECT_TOKEN }}
            VITE_PUBLIC_POSTHOG_HOST=${{ vars.VITE_PUBLIC_POSTHOG_HOST }}
            VITE_USERJOT_PROJECT_ID=${{ vars.VITE_USERJOT_PROJECT_ID }}
            VITE_APP_RELEASE=${{ github.sha }}

      # Same Cloudflare Access and deployment_uuid checks as the worker hooks
      # below: a 302 to the Access login or a null deployment_uuid is a refusal.
      - name: Trigger Coolify deploy (App)
        env:
          COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          APP_HOOK: ${{ secrets.COOLIFY_APP_WEBHOOK_URL }}
        run: |
          status=$(curl \
            --request POST \
            --silent \
            --show-error \
            --retry 3 \
            --retry-delay 2 \
            --retry-all-errors \
            --max-time 30 \
            --output response.json \
            --write-out '%{http_code}' \
            -H "Authorization: Bearer $COOLIFY_API_TOKEN" \
            -H "CF-Access-Client-Id: $CF_ACCESS_CLIENT_ID" \
            -H "CF-Access-Client-Secret: $CF_ACCESS_CLIENT_SECRET" \
            "$APP_HOOK")
          echo "App: HTTP $status"
          cat response.json; echo
          if [ "$status" != "200" ] || ! grep -q '"deployment_uuid":"' response.json; then
            echo "::error::Coolify did not queue the app deploy"
            exit 1
          fi

      # A queued deploy can still fail to pull or boot; only the new release
      # answering on the public domain counts as deployed.
      - name: Wait for the new release on hearted.music
        run: |
          for attempt in $(seq 1 60); do
            release=$(curl --silent --max-time 10 "https://hearted.music/health?ci=$attempt" | jq -r '.release // empty' 2>/dev/null || true)
            if [ "$release" = "$GITHUB_SHA" ]; then
              echo "hearted.music serves $GITHUB_SHA"
              exit 0
            fi
            echo "attempt $attempt: release=${release:-none}"
            sleep 10
          done
          echo "::error::hearted.music did not report release $GITHUB_SHA within 10 minutes"
          exit 1

  deploy-worker:
    needs: [detect, verify, db-security, migrate-prod]
    if: >-
      !cancelled()
      && needs.verify.result == 'success'
      && (needs.db-security.result == 'success' || needs.db-security.result == 'skipped')
      && (needs.migrate-prod.result == 'success' || needs.migrate-prod.result == 'skipped')
      && (
        (github.event_name == 'push'
          && needs.detect.outputs.code == 'true'
          && (needs.detect.outputs.worker == 'true' || needs.detect.outputs.shared == 'true'))
        || (github.event_name == 'workflow_dispatch'
          && github.ref == 'refs/heads/main'
          && inputs.deploy_worker)
      )
    runs-on: ubuntu-latest
    environment: production-worker
    timeout-minutes: 10
    concurrency:
      group: deploy-worker-production
      cancel-in-progress: false

    steps:
      # Coolify sits behind Cloudflare Access: without the service-token headers
      # Access answers 302 to its login page, which `curl --fail` treats as
      # success — that silently skipped every worker deploy from July to October.
      # Only a 200 whose body carries a non-null deployment_uuid counts — Coolify
      # also answers 200 with `"deployment_uuid":null` when it refuses.
      - name: Trigger Coolify deploys (Worker, Gateway)
        env:
          COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          WORKER_HOOK: ${{ secrets.COOLIFY_WORKER_DEPLOY_HOOK }}
          GATEWAY_HOOK: ${{ secrets.COOLIFY_GATEWAY_DEPLOY_HOOK }}
        run: |
          for target in WORKER GATEWAY; do
            hook_var="${target}_HOOK"
            status=$(curl \
              --request POST \
              --silent \
              --show-error \
              --retry 3 \
              --retry-delay 2 \
              --retry-all-errors \
              --max-time 30 \
              --output response.json \
              --write-out '%{http_code}' \
              -H "Authorization: Bearer $COOLIFY_API_TOKEN" \
              -H "CF-Access-Client-Id: $CF_ACCESS_CLIENT_ID" \
              -H "CF-Access-Client-Secret: $CF_ACCESS_CLIENT_SECRET" \
              "${!hook_var}")
            echo "$target: HTTP $status"
            cat response.json; echo
            if [ "$status" != "200" ] || ! grep -q '"deployment_uuid":"' response.json; then
              echo "::error::Coolify did not queue the $target deploy"
              exit 1
            fi
          done
